<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1d29" />
    <meta name="description" content="Quantum Key Distribution (BB84) Protocol Simulator with real IBM Quantum hardware integration" />
    <meta name="keywords" content="quantum computing, cryptography, BB84, quantum key distribution, IBM Quantum, Qiskit" />
    <meta name="author" content="QKD Simulator Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qkd-simulator.vercel.app/" />
    <meta property="og:title" content="QKD BB84 Simulator" />
    <meta property="og:description" content="Experience quantum cryptography with our interactive BB84 protocol simulator" />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://qkd-simulator.vercel.app/" />
    <meta property="twitter:title" content="QKD BB84 Simulator" />
    <meta property="twitter:description" content="Experience quantum cryptography with our interactive BB84 protocol simulator" />
    <meta property="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet" />
    
    <!-- Favicon variations -->
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    
    <title>QKD BB84 Simulator - Quantum Cryptography</title>
    
    <style>
      /* Loading screen styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a1d29 0%, #252837 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      
      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s, visibility 0.5s;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        border: 3px solid transparent;
        border-top: 3px solid #00d4ff;
        border-right: 3px solid #ff006b;
        border-radius: 50%;
        animation: spin 2s linear infinite;
        margin-bottom: 20px;
      }
      
      .loading-text {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 10px;
        background: linear-gradient(45deg, #00d4ff, #ff006b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .loading-subtitle {
        font-size: 14px;
        color: #8892b0;
        text-align: center;
        max-width: 300px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Prevent flash of unstyled content */
      body {
        margin: 0;
        padding: 0;
        background: #1a1d29;
        color: white;
        font-family: 'Inter', sans-serif;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Error boundary styles */
      .error-fallback {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
        background: #1a1d29;
        color: white;
      }
      
      .error-fallback h2 {
        color: #ff006b;
        margin-bottom: 10px;
      }
      
      .error-fallback p {
        color: #8892b0;
        margin-bottom: 20px;
        max-width: 500px;
        line-height: 1.6;
      }
      
      .error-fallback button {
        background: linear-gradient(45deg, #00d4ff, #ff006b);
        border: none;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s;
      }
      
      .error-fallback button:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-logo"></div>
      <div class="loading-text">QKD BB84 Simulator</div>
      <div class="loading-subtitle">Loading quantum cryptography simulation...</div>
    </div>
    
    <div id="root"></div>
    
    <script>
      // Hide loading screen once React app is loaded
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
              loadingScreen.remove();
            }, 500);
          }
        }, 1000);
      });
      
      // Global error handler
      window.addEventListener('error', function(event) {
        console.error('Global error:', event.error);
      });
      
      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled promise rejection:', event.reason);
      });
    </script>
  </body>
</html>
